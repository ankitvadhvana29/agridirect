services:
  - type: web
    name: agridirect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/agridirect.db
    disk:
      name: agridirect-data
      mountPath: /data
      sizeGB: 1
